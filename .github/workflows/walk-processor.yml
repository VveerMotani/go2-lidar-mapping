# Builds the walk processor image (docker/Dockerfile) and publishes it to the
# GitHub Container Registry, so nobody has to build it themselves:
#
#   docker pull ghcr.io/<owner>/<repo>/go2-walks:latest
#
# amd64 only. Apple Silicon Macs run it through Docker Desktop's emulation;
# an arm64 build needs Open3D's aarch64 wheel checked first.
name: Walk processor image

on:
  push:
    branches: [main]
    paths:
      - docker/**
      - notes/**
      - walks/*.json
      - walks/xt16_correction.csv
      - .github/workflows/walk-processor.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lower case, as the registry requires)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/go2-walks" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Self-test the published image
        run: docker run --rm ${{ steps.name.outputs.image }}:${{ github.sha }} selftest
